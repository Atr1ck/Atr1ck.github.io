<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atr1ck's blog</title>
    <script>
      try {
        const savedTheme = localStorage.getItem("theme");
        const theme = savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.documentElement.dataset.background = localStorage.getItem("background-enabled") === "false"
          ? "hidden"
          : "visible";
      } catch {
        document.documentElement.dataset.theme = "dark";
        document.documentElement.dataset.background = "visible";
      }
    </script>
  </head>
  <body class="relative min-h-screen bg-fixed">
    <div id="site-background" class="fixed inset-0 bg-cover bg-center -z-20"></div>
    <div id="site-overlay" class="fixed inset-0 -z-10"></div>
    <div id="root" class="relative z-10 overflow-auto min-h-screen"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
